<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مجلس العرب LIVE</title><style>*{box-sizing:border-box}body{margin:0;background:#171019;color:#fff0d8;font-family:system-ui,-apple-system,'Arial',sans-serif}main{max-width:480px;margin:auto}.stage{position:relative;aspect-ratio:9/14;overflow:hidden;background:linear-gradient(#23172c,#50304a)}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;top:12px;right:12px;left:12px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}.pill{background:#211522c9;border:1px solid #e5bd75;border-radius:14px;padding:8px 12px;font-weight:800}.small{font-size:12px;color:#ffe0a0}.ticker{position:absolute;bottom:15px;right:12px;left:12px;text-align:center;background:#211522c9;border:1px solid #dcae6d;border-radius:16px;padding:10px;font-weight:700;min-height:45px}.panel{padding:14px;background:#241824}.title{text-align:center;font-size:21px;font-weight:900;margin:0 0 9px}input{width:100%;background:#fff7eb;color:#302031;border:0;border-radius:10px;padding:12px;font-size:16px;text-align:right}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}button{border:1px solid #f0c680;background:#6d3a45;color:white;border-radius:12px;padding:13px 6px;font-size:16px;font-weight:800;cursor:pointer}button:active{transform:scale(.97)}button.secondary{background:#342b40}.note{font-size:12px;line-height:1.7;color:#dac8c5;margin:10px 0 0}.board{background:#35263a;border-radius:12px;padding:10px;margin-top:10px;font-size:14px}.board div{padding:3px 0}#mode{color:#9af1ba}</style></head><body><main><section class="stage"><canvas id="game" width="720" height="1120"></canvas><div class="overlay"><div class="pill"><div>مجلس العرب ☕</div><div class="small">السعودية 🇸🇦 • البحرين 🇧🇭</div></div><div class="pill"><div id="mode">● تجريبي</div><div class="small" id="count">الضيوف: 0</div></div></div><div class="ticker" id="ticker">حياكم الله في مجلس العرب ✨</div></section><section class="panel"><p class="title">جرّب التفاعل الآن</p><input id="username" placeholder="اسم الضيف" value="ضيف الخليج" maxlength="20"><div class="buttons"><button data-action="enter">🚪 دخول</button><button data-action="coffee">☕ قهوة</button><button data-action="dates">🌴 تمر</button><button data-action="salam">👋 سلام</button><button data-action="rose">🌹 هدية وردة (تجربة)</button><button class="secondary" id="random">🎭 ضيف عشوائي</button></div><div class="board"><strong>🏆 لوحة الشرف</strong><div id="leaders">لا يوجد ضيوف بعد</div></div><p class="note">نسخة تجريبية مجانية تعمل بدون اتصال TikTok. الأزرار تحاكي التعليقات والهدايا فقط؛ لا تجمع هدايا حقيقية أو أموالاً. جرّب فتح الصفحة من Safari على iPad.</p></section></main><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=720,H=1120;const guests=new Map();let actors=[],effects=[],queue=[],last=0,clock=0,active=null;const names=['محمد','فاطمة','عبدالله','نورة','سلمان','مريم','خالد','علي'];
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=4;ctx.stroke()}}
function poly(pts,fill,stroke){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=4;ctx.stroke()}}
function txt(t,x,y,size=25,color='#fff1d6'){ctx.fillStyle=color;ctx.font=`bold ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(t,x,y)}
function room(t){const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#352239');bg.addColorStop(.65,'#754852');bg.addColorStop(1,'#3a2432');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let i=0;i<9;i++){ctx.fillStyle=i%2?'#6b3b4b':'#734452';ctx.fillRect(i*90,0,4,720)}rr(140,180,440,300,150,'#201a32','#e6b96d');rr(164,204,392,250,130,'#332b49','#9f7654');ctx.fillStyle='#dba955';ctx.beginPath();ctx.arc(360,270,56,0,Math.PI*2);ctx.fill();txt('✦',360,290,76,'#51334d');for(let i=0;i<3;i++){ctx.strokeStyle='#b78658';ctx.lineWidth=5;ctx.strokeRect(205+i*108,310,90,100)}poly([[0,690],[720,690],[720,1120],[0,1120]],'#55333e');poly([[65,750],[655,750],[715,1050],[5,1050]],'#9e3e45','#e2b76c');poly([[125,790],[595,790],[630,1010],[90,1010]],'#532c4b','#e7bd76');for(let j=0;j<5;j++)for(let i=0;i<7;i++)txt('◆',130+i*75+(j%2)*20,820+j*43,16,'#d2a666');rr(20,630,680,115,22,'#713846','#d4a261');for(let i=0;i<5;i++){rr(35+i*138,640,120,84,15,i%2?'#a65a57':'#8e4c66','#e8b56c')}rr(245,700,230,75,38,'#7c513b','#e5b577');rr(275,684,170,35,16,'#aa7a49');txt('☕   🌴   ☕',360,710,35);for(const x of [75,645]){rr(x-27,465,54,168,16,'#7c503e','#d9aa61');txt('✦',x,525,42,'#f7d38a');}txt('أهلاً وسهلاً',360,118,45,'#f3d293')}
function person(a,t){const bounce=Math.sin(t/320+a.seed)*4;const x=a.x,y=a.y+bounce;ctx.save();ctx.translate(x,y);ctx.fillStyle='#20182677';ctx.beginPath();ctx.ellipse(0,52,48,13,0,0,Math.PI*2);ctx.fill();rr(-32,-35,64,84,22,a.color,'#ebceab');ctx.fillStyle='#e0a97e';ctx.beginPath();ctx.arc(0,-60,28,0,Math.PI*2);ctx.fill();rr(-29,-91,58,21,8,'#f6ead7');ctx.fillStyle='#2b1b27';ctx.fillRect(-14,-61,5,4);ctx.fillRect(11,-61,5,4);txt(a.icon,0,-110,31);txt(a.name.slice(0,12),0,85,22,'#fff5db');ctx.restore()}
function render(t){clock=t;room(t);actors.forEach(a=>person(a,t));effects=effects.filter(e=>t-e.at<2200);effects.forEach(e=>{const p=(t-e.at)/2200;ctx.globalAlpha=1-p;txt(e.icon,e.x,e.y-p*170,55+p*35);ctx.globalAlpha=1});requestAnimationFrame(render)}requestAnimationFrame(render);
function enqueue(action,name){queue.push({action,name});if(!active)runNext()}
function runNext(){if(!queue.length){active=null;return}active=queue.shift();const {action,name}=active;const points={enter:1,coffee:2,dates:2,salam:1,rose:3};let score=guests.get(name)||0;guests.set(name,score+points[action]);let actor=actors.find(a=>a.name===name);if(!actor){actor={name,x:110+(actors.length%5)*125,y:820+Math.floor(actors.length/5)*110,color:['#f5e6ce','#caa3ad','#c7d4c2','#d9c8f1'][actors.length%4],seed:actors.length,icon:'✨'};actors.push(actor);if(actors.length>8)actors.shift()}const icons={enter:'✨',coffee:'☕',dates:'🌴',salam:'👋',rose:'🌹'},phrases={enter:'انضم إلى المجلس',coffee:'تفضل القهوة العربية',dates:'تفضل التمر',salam:'وعليكم السلام',rose:'شكراً على الوردة التجريبية'};actor.icon=icons[action];effects.push({icon:icons[action],x:actor.x,y:actor.y-150,at:clock});document.getElementById('ticker').textContent=`${name} — ${phrases[action]}`;document.getElementById('count').textContent=`الضيوف: ${guests.size}`;document.getElementById('leaders').innerHTML=[...guests].sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,s],i)=>`<div>${i+1}. ${escapeHTML(n)} — ${s} نقطة</div>`).join('');setTimeout(()=>{active=null;runNext()},900)}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>enqueue(b.dataset.action,document.getElementById('username').value.trim()||'ضيف')));document.getElementById('random').addEventListener('click',()=>enqueue(['enter','coffee','dates','salam','rose'][Math.floor(Math.random()*5)],names[Math.floor(Math.random()*names.length)]));
</script></body></html>
